spring:
  application:
    name: spring-boot-template
  jpa:
    hibernate:
      ddl-auto: validate
  datasource:
    url: jdbc:postgresql://localhost:5432/application-db
    username: postgres
    password: postgres
  flyway:
    enabled: true
    user: postgres
    password: postgres
management:
  endpoints:
    web:
      exposure:
        include: health
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
jwt:
  rsa:
    public-key: classpath:certificates/public.pem
    private-key: classpath:certificates/private.pem
